<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração: feed de Instagram conectado a uma agenda de petshop confirmada">
  <rect width="1200" height="630" fill="#F5F0EB"/>
  <circle cx="1090" cy="70" r="150" fill="#81B29A" opacity="0.14"/>
  <circle cx="40" cy="580" r="170" fill="#E07A5F" opacity="0.12"/>

  <!-- Phone / Instagram mock -->
  <g transform="translate(150,95)">
    <rect x="-14" y="-14" width="288" height="468" rx="46" fill="#2C2421"/>
    <rect x="0" y="0" width="260" height="440" rx="34" fill="#FAFAF9"/>

    <!-- header -->
    <circle cx="45" cy="52" r="18" fill="#E07A5F"/>
    <path d="M37 52c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8-8-3.6-8-8Z" fill="#FAFAF9" opacity="0.9"/>
    <rect x="74" y="42" width="92" height="10" rx="5" fill="#8C7A6B" opacity="0.45"/>
    <rect x="74" y="58" width="60" height="8" rx="4" fill="#8C7A6B" opacity="0.25"/>

    <!-- grid 3x3 -->
    <g>
      <rect x="18" y="88" width="68" height="68" rx="10" fill="#E07A5F"/>
      <rect x="94" y="88" width="68" height="68" rx="10" fill="#E6DED8"/>
      <rect x="170" y="88" width="68" height="68" rx="10" fill="#81B29A"/>

      <rect x="18" y="164" width="68" height="68" rx="10" fill="#81B29A"/>
      <rect x="94" y="164" width="68" height="68" rx="10" fill="#E07A5F"/>
      <g transform="translate(94,164)">
        <circle cx="34" cy="24" r="6" fill="#FAFAF9"/>
        <circle cx="22" cy="34" r="6" fill="#FAFAF9"/>
        <circle cx="46" cy="34" r="6" fill="#FAFAF9"/>
        <path d="M34 58c-11 0-18 6-18 16 0 9 8 14 18 14s18-5 18-14c0-10-7-16-18-16Z" fill="#FAFAF9"/>
      </g>
      <rect x="170" y="164" width="68" height="68" rx="10" fill="#E6DED8"/>

      <rect x="18" y="240" width="68" height="68" rx="10" fill="#E6DED8"/>
      <rect x="94" y="240" width="68" height="68" rx="10" fill="#81B29A"/>
      <rect x="170" y="240" width="68" height="68" rx="10" fill="#E07A5F"/>
    </g>

    <!-- bio link pill -->
    <rect x="18" y="330" width="220" height="40" rx="20" fill="#2C2421"/>
    <circle cx="40" cy="350" r="6" fill="#FAFAF9"/>
    <rect x="56" y="344" width="160" height="12" rx="6" fill="#FAFAF9" opacity="0.85"/>

    <rect x="18" y="384" width="220" height="34" rx="17" fill="#E07A5F"/>
    <rect x="40" y="396" width="176" height="10" rx="5" fill="#FAFAF9"/>
  </g>

  <!-- connecting dashed path -->
  <path d="M460 260 C 560 180, 620 180, 660 260" stroke="#8C7A6B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" fill="none"/>
  <path d="M642 244 L662 262 L640 274" stroke="#8C7A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Calendar / agenda card -->
  <g transform="translate(660,150)">
    <rect x="10" y="18" width="340" height="300" rx="26" fill="#2C2421" opacity="0.06"/>
    <rect x="0" y="0" width="340" height="300" rx="26" fill="#FFFFFF"/>
    <rect x="0" y="0" width="340" height="64" rx="26" fill="#81B29A"/>
    <rect x="0" y="38" width="340" height="26" fill="#81B29A"/>
    <rect x="28" y="22" width="130" height="16" rx="8" fill="#FAFAF9"/>
    <circle cx="308" cy="32" r="14" fill="#FAFAF9" opacity="0.25"/>

    <!-- week grid -->
    <g fill="#E6DED8">
      <rect x="28" y="92" width="34" height="34" rx="8"/>
      <rect x="72" y="92" width="34" height="34" rx="8"/>
      <rect x="116" y="92" width="34" height="34" rx="8" fill="#E07A5F"/>
      <rect x="160" y="92" width="34" height="34" rx="8"/>
      <rect x="204" y="92" width="34" height="34" rx="8"/>
      <rect x="248" y="92" width="34" height="34" rx="8"/>
      <rect x="292" y="92" width="20" height="34" rx="8"/>
    </g>

    <rect x="28" y="150" width="284" height="14" rx="7" fill="#8C7A6B" opacity="0.25"/>
    <rect x="28" y="174" width="200" height="14" rx="7" fill="#8C7A6B" opacity="0.18"/>

    <!-- confirmation badge -->
    <circle cx="170" cy="240" r="34" fill="#E07A5F"/>
    <path d="M154 240 l12 12 24-26" stroke="#FAFAF9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="90" y="284" width="160" height="10" rx="5" fill="#8C7A6B" opacity="0.3"/>
  </g>
</svg>
